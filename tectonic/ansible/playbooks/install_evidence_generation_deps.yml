- name: "Update package cache (Debian)"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: "Update package cache (RedHat/Fedora)"
  ansible.builtin.dnf:
    update_cache: yes
  when: ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Fedora'

- name: "Install common DFIR packages (Debian)"
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - tcpdump
      - tshark
      - wireshark-common
    state: present
    install_recommends: no
  when: ansible_facts['os_family'] == 'Debian'

- name: "Install victim DFIR packages (Debian)"
  ansible.builtin.apt:
    name:
      - python3-dev
      - python3-venv
      - e2fsprogs
      - util-linux
      - build-essential
      - libssl-dev
      - libffi-dev
      - pkg-config
      - pandoc
    state: present
    install_recommends: no
  when: ansible_facts['os_family'] == 'Debian' and 'victim' in group_names

- name: "Install analyst DFIR packages (Debian)"
  ansible.builtin.apt:
    name:
      - nmap
      - netcat
    state: present
    install_recommends: no
  when: ansible_facts['os_family'] == 'Debian' and 'analyst' in group_names

- name: "Install common DFIR packages (RedHat/Fedora)"
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - tcpdump
      - wireshark
    state: present
  when: ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Fedora'

- name: "Install victim DFIR packages (RedHat/Fedora)"
  ansible.builtin.dnf:
    name:
      - python3-devel
      - gcc
      - openssl-devel
      - libffi-devel
      - pkgconfig
      - e2fsprogs
      - util-linux
      - pandoc
    state: present
  when: (ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Fedora') and 'victim' in group_names

- name: "Install analyst DFIR packages (RedHat/Fedora)"
  ansible.builtin.dnf:
    name:
      - nmap
      - nmap-ncat
    state: present
  when: (ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Fedora') and 'analyst' in group_names

- name: "Upgrade pip to latest version"
  ansible.builtin.command: "{{ ansible_python_interpreter | default('python3') }} -m pip install --upgrade pip"
  register: pip_upgrade
  changed_when: pip_upgrade.rc == 0
  when: "'victim' in group_names"

- name: "Install Python evidence generation dependencies"
  ansible.builtin.pip:
    name:
      - faker
      - Pillow
      - python-docx
      - openpyxl
      - cryptography
      - scapy
    state: present
    executable: pip3
  when: "'victim' in group_names"

- name: "Verify Python dependencies installation"
  ansible.builtin.command: '{{ ansible_python_interpreter | default(''python3'') }} -c ''import faker, PIL, docx, openpyxl, cryptography, scapy; print("All dependencies installed successfully")'''
  changed_when: false
  register: verify_deps
  failed_when: verify_deps.rc != 0
  when: "'victim' in group_names"

- name: "Verify system tools installation"
  ansible.builtin.command: "which mergecap pandoc"
  changed_when: false
  register: verify_tools
  failed_when: verify_tools.rc != 0
  when: "'victim' in group_names"

- name: "Display installation summary"
  ansible.builtin.debug:
    msg:
      - "=============================================="
      - "    DFIR BASE DEPENDENCIES INSTALLED"
      - "=============================================="
      - "✅ Common tools installed: python3, pip, tcpdump, tshark/wireshark"
      - "✅ Host profile: {{ 'victim' if 'victim' in group_names else 'analyst' if 'analyst' in group_names else 'generic' }}"
      - "✅ Victim profile includes evidence generation dependencies"
      - "=============================================="
